[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshoot"
version = "1.4.0"
description = "Raspberry Pi night intervalometer for Nikon cameras, driven from a phone"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Adria Ariste Santacreu" }]
keywords = ["astrophotography", "gphoto2", "intervalometer", "raspberry-pi", "nikon", "timelapse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture",
]

dependencies = [
  "flask>=3.0",
  "PyYAML>=6.0",
  # python-gphoto2. Needs libgphoto2-dev when no wheel is available, so it is
  # left out of the test extra and CI installs the stub instead.
  "gphoto2>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.2",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/aariste/nightshoot"
Issues = "https://github.com/aariste/nightshoot/issues"

[project.scripts]
nightshoot = "nightshoot.app:main"

[tool.setuptools.packages.find]
include = ["nightshoot*"]

[tool.setuptools.package-data]
nightshoot = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 180
filterwarnings = ["error::DeprecationWarning:nightshoot.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B008",    # Flask decorators legitimately call functions in defaults
  "SIM105",  # contextlib.suppress is not clearer for one-line gphoto2 guards
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

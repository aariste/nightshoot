name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The UI has no build step, but a couple of its functions are exercised
      # by running them under Node. Installed explicitly so those tests always
      # run: they skip when Node is missing, and a silent skip in CI is worse
      # than no test at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # python-gphoto2 is deliberately not installed: it needs libgphoto2-dev
      # and a real camera adds nothing here. tests/conftest.py substitutes a
      # stub that mimics a Nikon Z50, including its shutter-speed spellings.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flask>=3.0" "PyYAML>=6.0" "pytest>=8.0" "pytest-timeout>=2.2"

      - name: Run tests
        # Turns "node is missing so the UI tests were skipped" into a failure.
        env:
          NIGHTSHOOT_REQUIRE_NODE: "1"
        run: pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check nightshoot tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          bash -n install.sh
          bash -n hotspot-test.sh
          bash -n deploy-key.sh
          bash -n update.sh
          # Informational: the installer targets Raspberry Pi OS specifically.
          shellcheck -S warning install.sh hotspot-test.sh deploy-key.sh update.sh || true

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install PyYAML
      - name: Validate the shipped example scripts
        run: |
          python - <<'PY'
          import glob, sys, yaml
          for path in sorted(glob.glob("examples/scripts/*.yaml")):
              with open(path, encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              assert isinstance(data, dict) and data.get("steps"), path
              print("ok", path)
          PY

  crlf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject CRLF line endings
        # A stray CR in install.sh makes the Pi fail with "env: bash\r: No such
        # file or directory", which is a miserable thing to debug in a field.
        run: |
          if grep -rlIU $'\r' --exclude-dir=.git .; then
            echo "::error::CRLF line endings found"
            exit 1
          fi
          echo "all files are LF"
